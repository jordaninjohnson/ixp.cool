name: Website

on:
  push:
    paths:
      - 'index.html'
      - 'thank-you.html'
      - 'README.md'
      - 'tests/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'thank-you.html'
      - 'README.md'
      - 'tests/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

jobs:
  static-site-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify site claims, semantics, and navigation
        run: python -m unittest discover -s tests -v
